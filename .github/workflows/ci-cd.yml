name: CI/CD Pipeline - Fullstack Quality, Supply Chain & Security Gates

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write
  security-events: write

jobs:
  changes:
    name: Detect Component Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'render.yaml'
              - '.github/workflows/ci-cd.yml'
              - '.github/scripts/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/scripts/**'

      - name: Validate SonarQube readiness check
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  # =========================================================================
  # 1. PHASE 1: LINT & AUTOMATED TESTS (Unit, Architecture & Coverage)
  # =========================================================================
  test:
    needs: changes
    name: 🧪 Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 21 LTS (Temurin)
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 📦 Setup Node.js 22 LTS
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 🔍 Backend - Lint (Checkstyle) & Validation
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        run: |
          echo "Executando análise de linting no código Java com Checkstyle..."
          mvn -B checkstyle:check -f backend/pom.xml

      - name: 🏗️ Backend - Build & Run Tests with JaCoCo Coverage
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        run: |
          echo "Executando testes automatizados do Spring Boot 3 e gerando relatório JaCoCo..."
          mvn -B clean test jacoco:report -f backend/pom.xml

      - name: 🔍 Frontend - Install Dependencies & Run Lint (ESLint)
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: |
          npm ci
          echo "Executando linting no Angular 22 com ESLint..."
          npm run lint

      - name: 🎨 Frontend - Run Unit Tests (Vitest)
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: |
          echo "Executando testes unitários do Angular 22 com Vitest..."
          npm run test:coverage

      - name: 📤 Upload Frontend LCOV Coverage Report
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: 🏗️ Frontend - Production Build
        if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: |
          npm run build
          npm run build:api

      - name: 📤 Upload JaCoCo Coverage Report
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/jacoco.xml
          retention-days: 7

      - name: 📦 Package Backend JAR for DAST
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        run: |
          mvn -B package -DskipTests -f backend/pom.xml

      - name: 📤 Upload Backend JAR Artifact
        if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # =========================================================================
  # 2. PHASE 2A: SAST (Static Application Security Testing - Semgrep)
  # =========================================================================
  sast-semgrep:
    name: 🔒 SAST - Semgrep Security Audit
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🛡️ Run Semgrep SAST Scan (OWASP Top 10 & Security Rules)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/spring" \
            --config "p/typescript" \
            --sarif --output /src/semgrep.sarif || true

      - name: 📤 Upload Semgrep SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # =========================================================================
  # 3. PHASE 2B: SECRET SCANNING (Gitleaks)
  # =========================================================================
  secret-scanning:
    name: 🔑 Secret Leak Detection (Gitleaks)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Scan for Leaked Secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # =========================================================================
  # 4. PHASE 2C: SUPPLY CHAIN SECURITY (SBOM with Syft & CVEs with Grype)
  # =========================================================================
  supply-chain:
    name: 📦 Supply Chain - Syft (SBOM) & Grype (CVEs)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📜 Generate SBOM with Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft scan dir:. -o spdx-json=sbom.spdx.json

      - name: 🔍 Scan SBOM & Dependencies for Vulnerabilities with Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:sbom.spdx.json -o sarif > grype.sarif || true

      - name: 📤 Upload Grype SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype.sarif
        continue-on-error: true

  # =========================================================================
  # 5A. PHASE 3A: SONARQUBE ANALYSIS - BACKEND (damatch-backend)
  # =========================================================================
  sonar-backend:
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    name: 🛡️ SonarQube Quality Gate - Backend
    needs: [changes, test, sast-semgrep, secret-scanning, supply-chain]
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonar.fchicout.dev' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 21 LTS
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 📥 Download JaCoCo Coverage Artifact
        uses: actions/download-artifact@v8
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco

      - name: 🏗️ Compile Backend for SonarQube
        run: |
          mvn -B -DskipTests compile -f backend/pom.xml

      - name: Wait for SonarQube availability
        timeout-minutes: 3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            python3 .github/scripts/wait_for_sonar.py
          fi

      - name: 🔍 Run SonarQube Scanner (damatch-backend) & Wait for Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "⚠️ SONAR_TOKEN não configurado nos segredos do repositório. Análise SonarQube opcional concluída."
          else
            echo "Iniciando análise estática e verificação do Quality Gate no SonarQube (damatch-backend)..."
            mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.token="${SONAR_TOKEN}" \
              -Dsonar.projectKey="damatch-backend" \
              -Dsonar.java.binaries="target/classes" \
              -Dsonar.coverage.jacoco.xmlReportPaths="backend/target/site/jacoco/jacoco.xml" \
              -Dsonar.qualitygate.wait=true
          fi

  # =========================================================================
  # 5B. PHASE 3B: SONARQUBE ANALYSIS - FRONTEND (damatch-frontend)
  # =========================================================================
  sonar-frontend:
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    name: 🛡️ SonarQube Quality Gate - Frontend
    needs: [changes, test, sast-semgrep, secret-scanning, supply-chain]
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonar.fchicout.dev' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 🔍 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 📥 Download Frontend LCOV Coverage Report
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage-report
          path: frontend/coverage/frontend

      - name: 🔎 Verify Frontend Coverage Report
        working-directory: ./frontend
        run: test -s coverage/frontend/lcov.info

      - name: Wait for SonarQube availability
        timeout-minutes: 3
        run: python3 .github/scripts/wait_for_sonar.py

      - name: 🔍 Run SonarQube Scanner (damatch-frontend) & Wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=damatch-frontend
            -Dsonar.qualitygate.wait=true

  # =========================================================================
  # 6. PHASE 4A: DAST FOR DEVELOPMENT/STAGING (ProjectDiscovery Nuclei)
  # =========================================================================
  dast-development-nuclei:
    name: ⚡ DAST Staging - Nuclei Scanner
    needs: [changes, sonar-backend, sonar-frontend]
    if: >-
      always() &&
      (github.ref == 'refs/heads/development' || github.event_name == 'pull_request') &&
      needs.sonar-backend.result == 'success' &&
      (needs.sonar-frontend.result == 'success' || needs.sonar-frontend.result == 'skipped')
    runs-on: ubuntu-latest

    # Banco exclusivo e descartável para o scan. Cada execução recebe um
    # container novo, destruído automaticamente quando o job termina.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: damatch_dast
          POSTGRES_USER: dast
          POSTGRES_PASSWORD: dast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dast -d damatch_dast"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: ☕ Setup Java 21 LTS
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📥 Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: target

      - name: 🚀 Start Backend API for Nuclei Scan
        env:
          # A aplicação ainda usa este nome de variável, mas o destino é o
          # PostgreSQL efêmero do job, nunca o Supabase.
          SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/damatch_dast?user=dast&password=dast
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "Iniciando backend API em background: $JAR_FILE"
          java -jar "$JAR_FILE" > backend-runtime.log 2>&1 &
          echo "Aguardando endpoint de healthcheck subir..."
          if ! timeout 60 bash -c 'until curl -fs http://localhost:8080/api/v1/health | grep -q "UP"; do sleep 2; done'; then
            echo "::error::A API não ficou pronta em 60 segundos. Log de inicialização:"
            tail -n 200 backend-runtime.log || true
            exit 1
          fi
          echo "✅ Backend API está UP e pronto para análise Nuclei!"

      - name: 🎯 Execute Nuclei DAST Scan (Vulnerabilities, Misconfigurations & API Flaws)
        uses: projectdiscovery/nuclei-action@v3
        with:
          cache: false
          args: '-u http://localhost:8080 -tags cve,misconfig,exposure,tech -severity critical,high,medium -silent'
        continue-on-error: true

  # =========================================================================
  # 7. PHASE 4B: DAST FOR PRODUCTION/MAIN (OWASP ZAP Baseline Scan)
  # =========================================================================
  dast-production-zap:
    name: 🛡️ DAST Production - OWASP ZAP Scan
    needs: [changes, sonar-backend, sonar-frontend]
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.sonar-backend.result == 'success' &&
      (needs.sonar-frontend.result == 'success' || needs.sonar-frontend.result == 'skipped')
    runs-on: ubuntu-latest

    # Banco exclusivo e descartável para o scan. Cada execução recebe um
    # container novo, destruído automaticamente quando o job termina.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: damatch_dast
          POSTGRES_USER: dast
          POSTGRES_PASSWORD: dast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dast -d damatch_dast"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: ☕ Setup Java 21 LTS
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📥 Download Backend JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: target

      - name: 🚀 Start Backend API for OWASP ZAP Scan
        env:
          # A aplicação ainda usa este nome de variável, mas o destino é o
          # PostgreSQL efêmero do job, nunca o Supabase.
          SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/damatch_dast?user=dast&password=dast
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "Iniciando backend API em background: $JAR_FILE"
          java -jar "$JAR_FILE" > backend-runtime.log 2>&1 &
          echo "Aguardando endpoint de healthcheck subir..."
          if ! timeout 60 bash -c 'until curl -fs http://localhost:8080/api/v1/health | grep -q "UP"; do sleep 2; done'; then
            echo "::error::A API não ficou pronta em 60 segundos. Log de inicialização:"
            tail -n 200 backend-runtime.log || true
            exit 1
          fi
          echo "✅ Backend API está UP e pronto para o OWASP ZAP scan!"

      - name: 🕷️ Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080/api/v1/health'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false
        continue-on-error: true

  # =========================================================================
  # 8. PHASE 5A: DEPLOY STAGING (Triggered on development branch)
  # =========================================================================
  deploy-staging:
    name: 🚀 Deploy Staging Environment
    needs: [dast-development-nuclei]
    if: github.ref == 'refs/heads/development' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Packaging Staging Artifacts
        run: |
          echo "=================================================================================="
          echo "📦 Testes, Lint, SAST, Betterleaks, Supply Chain, SonarQube e DAST (Nuclei) APROVADOS!"
          echo "Disparando deploy para o ambiente de STAGING..."
          echo "Branch: development (Commit: ${{ github.sha }})"
          echo "=================================================================================="

      - name: 🚢 Staging Deploy Hook
        run: |
          echo "✅ Deploy em Staging finalizado com sucesso."

  # =========================================================================
  # 9. PHASE 5B: DEPLOY PRODUCTION (Triggered on main branch / release tags)
  # =========================================================================
  deploy-production:
    name: 🏆 Deploy Production Environment
    needs: [dast-production-zap]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Packaging Production Release
        run: |
          echo "=================================================================================="
          echo "🏆 Quality, Betterleaks, Supply Chain & DAST (OWASP ZAP) 100% APROVADOS para PRODUÇÃO!"
          echo "Branch: main (Release Commit: ${{ github.sha }})"
          echo "=================================================================================="

      - name: ☁️ Deploy Frontend (Angular) to Vercel
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
        run: |
          npm install --global vercel@latest
          echo "Baixando configuração de ambiente de produção da Vercel..."
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          echo "Gerando build de produção..."
          vercel build --prod --token="$VERCEL_TOKEN"
          echo "Publicando artefatos já buildados na Vercel..."
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: 🚀 Deploy Backend (Spring Boot) to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "❌ RENDER_DEPLOY_HOOK_URL não configurado nos segredos do repositório."
            exit 1
          fi
          echo "Disparando deploy do commit $GITHUB_SHA para o Render..."
          QUERY_SEPARATOR="?"
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) QUERY_SEPARATOR="&" ;;
          esac
          curl --fail --show-error --silent --retry 3 --retry-all-errors \
            --request POST "${RENDER_DEPLOY_HOOK_URL}${QUERY_SEPARATOR}ref=${GITHUB_SHA}"
          echo "✅ Deploy do backend no Render disparado com sucesso."
      
