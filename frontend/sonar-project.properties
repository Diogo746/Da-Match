# Execute o scanner a partir de frontend, depois de npm run test:coverage.
sonar.projectKey=damatch-frontend
sonar.projectName=DaMatch - Frontend
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,src/test-setup.ts
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
