# Activate with SPRING_PROFILES_ACTIVE=vercel; the profile group also loads prod.
# No secret, database address or production origin belongs in this file.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${APP_DB_MAX_POOL_SIZE:4}
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 60000
      max-lifetime: 600000
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

app:
  security:
    auth-mode: JWT
